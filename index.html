    <style>
        /* ওয়েবসাইটের মূল ডিজাইন */
        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* বড় এবং আকর্ষণীয় টাইটেল */
        .main-title {
            font-size: 3.5rem;
            margin-top: 50px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 50px;
        }

        /* গ্যালারি গ্রিড */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ইমেজের কার্ড ডিজাইন */
        .card {
            position: relative;
            width: 350px;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #000;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.4);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .card:hover img {
            opacity: 1;
        }

        /* ফেক প্লে বাটন ডিজাইন */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 0, 85, 0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .play-btn::after {
            content: '';
            display: block;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 20px solid white;
            margin-left: 6px;
        }
    </style>
