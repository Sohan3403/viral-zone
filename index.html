<script>
    // তোমার দেওয়া ডিরেক্ট অ্যাড লিংকগুলো
    const adLinks = [
        "https://www.profitableratecpmnetwork.com/q301y256m?key=9ad3a41fff7936759bcd90a0384516d6",
        "https://www.profitableratecpmnetwork.com/cgmc8cxuq?key=57cd0652088b50ff88f910152f0dc6ac",
        "https://www.profitableratecpmnetwork.com/g5iq4dhfw?key=a6662763b2ab88f1de870adea23fb4ef",
        "https://www.profitableratecpmnetwork.com/acirc3cd?key=bc8f2b3bf08bc12fb14d1a3d7b4255bb"
    ];

    const gallery = document.getElementById("gallery");

    // ১০০ টা ইমেজের জন্য লুপ (১০০ এর জায়গায় ১০,০০০ দিলে ১০,০০০ টা তৈরি হবে)
    for(let i = 1; i <= 100; i++) {
        let card = document.createElement("div");
        card.className = "card";
        
        let img = document.createElement("img");
        
        // এখানে তোমার ছবিগুলোর নাম কল করা হয়েছে (যেমন: image-1.jpg, image-2.jpg)
        img.src = "image-" + i + ".jpg"; 
        img.style.cursor = "pointer"; // মাউস নিলে হাতের আইকন দেখাবে যাতে মানুষ ক্লিক করে

        // ছবিতে ক্লিক করলেই তোমার অ্যাডগুলো ওপেন হবে
        img.addEventListener('click', () => {
            let randomAd = adLinks[Math.floor(Math.random() * adLinks.length)];
            window.open(randomAd, '_blank');
        });

        card.appendChild(img);
        gallery.appendChild(card);
    }
</script>
