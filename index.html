
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Hub</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #080808;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
h1 { color: #ffbd20; font-size: 24px; margin: 0; }
input {
  background: #252525;
  border: 1px solid #444;
  color: white;
  padding: 12px;
  border-radius: 6px;
}
main { padding: 16px; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.card { background: #202020; border-radius: 6px; overflow: hidden; }
.cover {
  background: linear-gradient(135deg, #343434, #171717);
  aspect-ratio: 16 / 9;
  display: grid;
  place-items: center;
  color: #ffbd20;
  font-size: 24px;
}
.info { padding: 10px; }
.info h3 { font-size: 15px; margin: 0 0 8px; }
.info p { font-size: 12px; color: #aaa; margin: 0; }
@media(max-width:650px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media(max-width:400px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>▶ Video Hub</h1>
  <input id="search" placeholder="Search videos..." aria-label="Search videos">
</header>
<main>
  <h2>Latest Videos</h2>
  <div class="grid" id="grid"></div>
</main>
<script>
const samples = [
  ["Welcome to Video Hub", "Featured"],
  ["Sample Video 2", "Latest"],
  ["Sample Video 3", "Popular"],
  ["Sample Video 4", "Featured"],
  ["Sample Video 5", "Latest"],
  ["Sample Video 6", "Popular"]
];
const grid = document.getElementById("grid");
function showVideos(query = "") {
  grid.replaceChildren();
  samples.filter(v => v[0].toLowerCase().includes(query.toLowerCase()))
    .forEach(v => {
      const card = document.createElement("article");
      card.className = "card";
      const cover = document.createElement("div");
      cover.className = "cover";
      cover.textContent = "▶";
      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("h3");
      title.textContent = v[0];
      const category = document.createElement("p");
      category.textContent = v[1];
      info.append(title, category);
      card.append(cover, info);
      grid.append(card);
    });
}
document.getElementById("search").addEventListener("input", e => showVideos(e.target.value));
showVideos();
</script>
</body>
</html>
